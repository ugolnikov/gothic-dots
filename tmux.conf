set -g focus-events on
# Включить поддержку мыши (клики по панелям, изменение размера, прокрутка логов колесиком!)
set -g mouse on

# Status bar
set -g status-interval 10
set -g status-right "#[fg=cyan]%H:%M #[fg=green]%d.%m.%Y"
set -g status-left "#[fg=blue,bold]#S #[fg=yellow]#I:#P"
set -g status-style "fg=#a0a0a0,bg=#1a1a2e"
setw -g window-status-current-style "fg=black,bg=cyan"

# Копирование в системный буфер (Linux)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -sel clip"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -sel clip"

# Увеличить историю прокрутки строк (по умолчанию она очень маленькая)
set -g history-limit 50000

# Начать нумерацию окон и панелей с 1, а не с 0 (так удобнее тянуться пальцами на клавиатуре)
set -g base-index 1
setw -g pane-base-index 1

# Быстрая перезагрузка конфига сочетарнием Prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Конфиг перезагружен!"
