set -g focus-events on
# Включить поддержку мыши (клики по панелям, изменение размера, прокрутка логов колесиком!)
set -g mouse on

# Status bar (готика: костяной текст на почти чёрном, кровавый акцент)
set -g status-interval 10
set -g status-style "fg=#d6d1c9,bg=#101013"
set -g status-left "#[fg=#a31621,bold]#S #[fg=#8b857c]#I:#P"
set -g status-right "#[fg=#a31621]%H:%M #[fg=#8b857c]%d.%m.%Y"
setw -g window-status-style "fg=#8b857c,bg=#101013"
setw -g window-status-current-style "fg=#0a0a0b,bg=#a31621,bold"

# Копирование в системный буфер (Wayland)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"

# Увеличить историю прокрутки строк (по умолчанию она очень маленькая)
set -g history-limit 50000

# Начать нумерацию окон и панелей с 1, а не с 0 (так удобнее тянуться пальцами на клавиатуре)
set -g base-index 1
setw -g pane-base-index 1

# Быстрая перезагрузка конфига сочетанием Prefix + r
bind r source-file ~/.tmux.conf \; display "Конфиг перезагружен!"
