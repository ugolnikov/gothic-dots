# foot — лёгкий Wayland-терминал (замена kitty). Готик-минимализм + перф.
# Сгенерированная палитра (light/dynamic) подключается первой; в dark файл
# пуст, и остаются цвета ниже. include требует абсолютный путь (или ~).
# Автозапуск держит сервер (foot --server), окна открываются через footclient
# мгновенно. Конфиг читается и сервером, и клиентом.

include=~/.config/foot/colors.dynamic.ini

[main]
term=foot
font=JetBrainsMono Nerd Font:size=11
font-bold=JetBrainsMono Nerd Font:style=Bold:size=11
dpi-aware=no
pad=10x10
selection-target=clipboard
utmp-helper=none

[scrollback]
lines=5000
multiplier=3.0

[cursor]
style=beam
blink=no

[mouse]
hide-when-typing=yes

[colors]
alpha=1.0
background=0a0a0b
foreground=d6d1c9
regular0=17171a
regular1=a31621
regular2=8f7a4a
regular3=8f7a4a
regular4=6c4f8f
regular5=8b5a63
regular6=9d8ec7
regular7=d6d1c9
bright0=4a4a52
bright1=c81e3a
bright2=b8975a
bright3=8f7a4a
bright4=6c4f8f
bright5=8b5a63
bright6=b4a6d9
bright7=e8e2d8
cursor=d6d1c9 a31621
