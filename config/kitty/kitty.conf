# kitty — тема. Цвета подключаются из colors.conf (готик-палитра по умолчанию)
# и colors.dynamic.conf, который wallust генерирует из обоев.

include colors.conf
include colors.dynamic.conf

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

cursor_shape           beam
cursor_blink_interval  0.5
scrollback_lines       10000

window_padding_width    12
background_opacity      1.0
confirm_os_window_close 0
