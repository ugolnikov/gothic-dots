# wallust — обои → Starship. Генерируется, не редактируй.
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory$git_branch$git_status$cmd_duration$character"""

palette = "gothic"

[palettes.gothic]
bg = "#{{background}}"
fg = "#{{foreground}}"
ash = "#{{color7}}"
blood = "#{{color1}}"
violet = "#{{color5}}"
gold = "#{{color3}}"

[directory]
style = "fg:fg"
format = "[$path]($style) "
truncation_length = 4
truncate_to_repo = true

[git_branch]
style = "fg:blood"
format = "[$branch]($style) "

[git_status]
style = "fg:gold"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
style = "fg:ash"
min_time = 2000
format = "[$duration]($style) "

[character]
success_symbol = "[❯](fg:blood)"
error_symbol = "[❯](fg:blood)"
vimcmd_symbol = "[❮](fg:violet)"
