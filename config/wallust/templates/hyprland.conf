# wallust — обои → Hyprland. Генерируется, не редактируй.
# Подключается последним в hyprland.conf и перекрывает colors.conf.

general {
    col.active_border = rgba({{color4}}ff) rgba({{color5}}ff) 45deg
    col.inactive_border = rgba({{color0}}ff)
}

decoration {
    shadow {
        color = rgba({{background}}ee)
    }
}

misc {
    background_color = rgba({{background}}ff)
}
