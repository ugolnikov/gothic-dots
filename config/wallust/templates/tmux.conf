# wallust — обои → tmux. Генерируется, не редактируй.
# Подключается из tmux.conf через source-file.
set -g status-style "fg=#{{foreground}},bg=#{{color0}}"
set -g status-left "#[fg=#{{color1}},bold]#S #[fg=#{{color7}}]#I:#P"
set -g status-right "#[fg=#{{color1}}]%H:%M #[fg=#{{color7}}]%d.%m.%Y"
setw -g window-status-style "fg=#{{color7}},bg=#{{color0}}"
setw -g window-status-current-style "fg=#{{background}},bg=#{{color1}},bold"
