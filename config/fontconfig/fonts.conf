<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Готический сериф для интерфейса, Nerd Font для моно. Имена идут
         стеком: ставится первый доступный. FreeSerif всегда есть в репозитории. -->
    <alias binding="same">
        <family>sans-serif</family>
        <prefer>
            <family>Cormorant Garamond</family>
            <family>Cinzel</family>
            <family>EB Garamond</family>
            <family>FreeSerif</family>
            <family>Liberation Serif</family>
            <family>DejaVu Serif</family>
        </prefer>
    </alias>
    <alias binding="same">
        <family>serif</family>
        <prefer>
            <family>Cormorant Garamond</family>
            <family>EB Garamond</family>
            <family>FreeSerif</family>
            <family>DejaVu Serif</family>
        </prefer>
    </alias>
    <alias binding="same">
        <family>monospace</family>
        <prefer>
            <family>JetBrainsMono Nerd Font</family>
            <family>JetBrains Mono</family>
            <family>DejaVu Sans Mono</family>
        </prefer>
    </alias>

    <!-- Рендер: градации серого, лёгкий хинтинг — чисто и дёшево. -->
    <match target="font">
        <edit name="antialias" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hinting" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hintstyle" mode="assign">
            <const>hintslight</const>
        </edit>
        <edit name="rgba" mode="assign">
            <const>none</const>
        </edit>
        <edit name="lcdfilter" mode="assign">
            <const>none</const>
        </edit>
    </match>
</fontconfig>
