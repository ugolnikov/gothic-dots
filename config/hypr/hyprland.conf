# Hyprland — configuration split by concern.
# Point of entry: everything else lives under conf.d/ and is sourced in order.
# Re-theme the whole desktop by editing conf.d/colors.conf only.

source = ~/.config/hypr/conf.d/colors.conf
source = ~/.config/hypr/conf.d/env.conf
source = ~/.config/hypr/conf.d/monitors.conf
source = ~/.config/hypr/conf.d/input.conf
source = ~/.config/hypr/conf.d/decoration.conf
source = ~/.config/hypr/conf.d/animations.conf
source = ~/.config/hypr/conf.d/layouts.conf
source = ~/.config/hypr/conf.d/rules.conf
source = ~/.config/hypr/conf.d/autostart.conf
source = ~/.config/hypr/conf.d/binds.conf

# Палитра, сгенерированная wallust из обоев (scripts/theme.sh при логине).
# Нет файла — Hyprland просто пропустит source и останется на colors.conf.
source = ~/.config/hypr/conf.d/colors.dynamic.conf

# Выборы из центра настроек (SUPER + ,): раскладка и анимации. Пишутся в
# ~/.config/hypr/ и в git не попадают; нет файла — остаются дефолты
# из decoration.conf (dwindle) и animations.conf (выключены).
source = ~/.config/hypr/conf.d/layout.dynamic.conf
source = ~/.config/hypr/conf.d/animations.dynamic.conf
