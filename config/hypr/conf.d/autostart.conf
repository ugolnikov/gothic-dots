# Что запускается в сессии. Минимум демонов: панель, уведомления, обои,
# блокировка, буфер обмена, политика и портал. Сетевые и BT-апплеты убраны —
# сеть и Bluetooth управляются из Waybar / по требованию (nmtui, bluetui).

# Экспорт окружения в systemd/dbus: нужно порталам (screensharing, файловые
# диалоги) и пользовательским сервисам (hyprpolkitagent).
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = awww-daemon --format xrgb
exec-once = ~/.config/hypr/scripts/theme.sh

# foot в режиме сервера: окна открываются мгновенно через footclient (SUPER+Return).
exec-once = foot --server

exec-once = waybar
# Демон уведомлений выбирается в центре настроек (mako или swaync).
exec-once = ~/.config/hypr/scripts/notifications.sh
# Переключатели, пережившие вход: DND, ночной свет и кофеин восстанавливаются
# из маркеров (запись экрана никогда не стартует сама).
exec-once = ~/.config/hypr/scripts/controls.sh restore
exec-once = hypridle

# Буфер обмена: cliphist + сохранение после закрытия приложения.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-clip-persist --clipboard regular

# Политика (GUI-авторизация): лёгкий hyprpolkitagent вместо polkit-gnome.
# Сначала пробуем systemd user-юнит, иначе — бинарь напрямую.
exec-once = sh -c 'systemctl --user start hyprpolkitagent 2>/dev/null || exec /usr/lib/hyprpolkitagent/hyprpolkitagent'
exec-once = /usr/lib/xdg-desktop-portal-hyprland
