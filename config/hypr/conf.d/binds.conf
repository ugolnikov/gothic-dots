# Клавиши. SUPER (Mod) — основной модификатор.

$mod = SUPER
$terminal = ~/.config/hypr/scripts/run-in-terminal.sh
$fileManager = ~/.config/hypr/scripts/filemanager.sh
$menu = ~/.config/hypr/scripts/launcher.sh
$browser = firefox

# --- Основное ---
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod SHIFT, Q, exit,
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exec, ~/.config/hypr/scripts/powermenu.sh
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, G, togglesplit,
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod, Space, exec, $menu

# --- Фокус: стрелки и vim ---
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# --- Перемещение окон ---
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# --- Изменение размера ---
bind = $mod CTRL, H, resizeactive, -40 0
bind = $mod CTRL, L, resizeactive, 40 0
bind = $mod CTRL, K, resizeactive, 0 -40
bind = $mod CTRL, J, resizeactive, 0 40

# --- Рабочие столы ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bind = $mod, Tab, workspace, previous

# --- Special workspace (scratchpad) ---
bind = $mod, grave, togglespecialworkspace, magic
bind = $mod SHIFT, grave, movetoworkspace, special:magic

# --- Медиа и железо ---
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindle = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- Скриншоты ---
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh full
bind = $mod, Print, exec, ~/.config/hypr/scripts/screenshot.sh region
bind = $mod SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh window
bind = $mod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh region edit

# --- Прочее ---
bind = $mod SHIFT, V, exec, ~/.config/hypr/scripts/clipboard.sh
bind = $mod, comma, exec, ~/.config/hypr/scripts/settings.sh
bind = $mod, W, exec, ~/.config/hypr/scripts/wallpaper-picker.sh
bind = $mod, R, exec, hyprctl reload
bind = $mod SHIFT, R, exec, pkill waybar && waybar &
bind = $mod, N, exec, ~/.config/hypr/scripts/dismiss.sh
bind = $mod, C, exec, hyprpicker -a
bind = $mod, M, exec, command -v nm-connection-editor >/dev/null && nm-connection-editor
bind = $mod, X, exec, hyprlock

# Переключение биндингов цифр/стрелок по «резине» мыши
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
