# Готик-минимализм + перф: без блюра и теней, тонкая одноцветная рамка,
# почти прямые углы, tearing включён (срабатывает только на правилах `immediate`).

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = $red
    col.inactive_border = $border
    resize_on_border = true
    layout = dwindle
    allow_tearing = true
}

decoration {
    rounding = 2
    rounding_power = 2

    # Без прозрачности: композитинг не тратится, картинка чётче.
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true          # меньше лишних кадров
    vrr = 0             # на VRR-панели попробуй 1 (плавнее, но бывает фликер)
    focus_on_activate = true
    font_family = "Cormorant Garamond"
    background_color = $bg
}

# Снижение задержки/разрывов вывода.
render {
    explicit_sync = 2   # auto
}

# Полное отслеживание повреждений — меньше перерисовок.
debug {
    damage_tracking = 2
}
