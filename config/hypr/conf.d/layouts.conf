# Параметры раскладок. Dwindle по умолчанию; master и scrolling на выбор
# (переключение — центр настроек, SUPER + ,).

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    new_status = master
    new_on_top = false
    mfact = 0.55
    orientation = center
    smart_resizing = true
}

# Нативный scrolling-layout (PaperWM-стиль), если хочется ленту:
