# Мониторы. Пусто/закомментировано = Hyprland сам определит и выставит
# предпочтительный режим. Раскомментируй и поправь под себя.
#
# Узнать имена и режимы:  hyprctl monitors all
#
# Пример ноутбука с внешним 1440p справа:
# monitor = eDP-1, 1920x1200@60, 0x0, 1
# monitor = DP-1, 2560x1440@144, 1920x0, 1
#
# HiDPI, масштаб 1.5:
# monitor = eDP-1, 2880x1800@120, 0x0, 1.5
#
# Зеркало и отключение:
# monitor = HDMI-A-1, 1920x1080@60, 0x0, 1, mirror, eDP-1
# monitor = DP-2, disable

# Правки, специфичные для конкретной машины, держи в отдельном файле,
# чтобы этот шаблон оставался переносимым:
source = ~/.config/hypr/conf.d/monitors.local.conf
