# Правила окон и слоёв. Минимально: плавающие диалоги и tearing для игр.

# Плавающие служебные окна
windowrule = float, class:^(pavucontrol)$
windowrule = size 800 600, class:^(pavucontrol)$
windowrule = center, class:^(pavucontrol)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(blueman-manager)$
windowrule = workspace current, class:^(mpv)$

# Tearing (минимальная задержка) только для игр и fullscreen-окон.
# Глобально tearing не включается — нужен allow_tearing = true (см. decoration.conf).
windowrule = immediate, class:^(gamescope)$
windowrule = immediate, class:^(steam_app_.*)$
windowrule = immediate, fullscreen:1
