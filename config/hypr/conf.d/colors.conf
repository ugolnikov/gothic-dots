# Готик-палитра. Почти чёрный фон, костяной текст, кровавый акцент.
# Это фиксированные цвета рабочего стола. Генерацию палитры из обоев (wallust)
# можно включить отдельно (см. scripts/theme.sh и config/hypr/README.md).

$bg      = rgba(0a0a0bee)   # фон
$bg_alt  = rgba(101013ee)   # панели
$surface = rgba(17171aff)   # поверхность
$border  = rgba(232327ff)   # неактивная рамка
$muted   = rgba(4a4a52ff)   # приглушённое
$subtext = rgba(8b857cff)   # пепел
$text    = rgba(d6d1c9ff)   # кость
$bone    = rgba(e8e2d8ff)   # светлая кость
$red     = rgba(a31621ff)   # кровь (акцент)
$red_hi  = rgba(c81e3aff)   # кровь, ярче
$violet  = rgba(6c4f8fff)   # сумеречный фиолетовый
$gold    = rgba(8f7a4aff)   # тусклое золото
