# hyprlock — экран блокировки. Готик-минимализм: почти чёрный, тонкая рамка,
# минимальный блюр (только на момент блокировки).

background {
    monitor =
    path = ~/.config/hypr/wallpaper.png
    color = rgba(0a0a0bff)
    blur_passes = 1
    blur_size = 4
    brightness = 0.45
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    dots_size = 0.26
    dots_spacing = 0.14
    dots_center = true
    rounding = 2
    outer_color = rgba(a31621ff)
    inner_color = rgba(0a0a0bee)
    font_color = rgba(d6d1c9ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##4a4a52">Пароль…</span>
    fail_text = <span foreground="##a31621">Неверно</span>
    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 92
    font_family = Cormorant Garamond
    color = rgba(d6d1c9ff)
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = Cormorant Garamond
    color = rgba(8b857cff)
    position = 0, 74
    halign = center
    valign = center
}
