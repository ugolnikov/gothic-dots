# keyd — Ctrl / Alt / Super шорткаты работают независимо от раскладки.
# Обычный ввод (main) не трогаем: печатается то, что набираешь (в т.ч. по-русски).
# А под модификаторами кириллические буквы ведут себя как соответствующие
# латинские — так ярлыки (Ctrl+S, Super+A, Alt+F и т.п.) работают во ВСЕХ
# приложениях (nvim, micro, браузер...), даже на русской раскладке.

[ids]
*

[main]

# --- Ctrl + русская буква = Ctrl + латинская ---
[control]
й = q
ц = w
у = e
к = r
е = t
н = y
г = u
ш = i
щ = o
з = p
ф = a
ы = s
в = d
а = f
п = g
р = h
о = j
л = k
д = l
я = z
ч = x
с = c
м = v
и = b
т = n
ь = m

