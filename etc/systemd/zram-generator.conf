# zram-generator — сжатый swap в RAM. Ставится system-setup.sh.
# После установки применится при следующей загрузке.

[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
# Без mount-point/fs-type устройство используется как swap (поведение по
# умолчанию у zram-generator). fs-type задаёт ФС, а не swap, поэтому здесь не нужен.
