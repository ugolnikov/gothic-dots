name: Bug report
description: Something in the rice, the install or the scripts is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Running `./scripts/doctor.sh` first often points
        straight at the cause — paste its output below.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ./install.sh
        2. press SUPER + ...
        3. see ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Distro / Hyprland version
      placeholder: CachyOS, Hyprland 0.4x
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of ./scripts/doctor.sh
      render: text
    validations:
      required: false
