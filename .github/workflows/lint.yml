name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: |
          set -e
          while IFS= read -r f; do
            echo "bash -n $f"
            bash -n "$f"
          done < <(git ls-files | grep -E '\.sh$')

      - name: ShellCheck
        run: |
          set -e
          mapfile -t files < <(git ls-files | grep -E '\.sh$')
          shellcheck --severity=warning -x "${files[@]}"

      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json, glob, sys
          for p in ["config/swaync/config.json"]:
              json.load(open(p))
              print("ok", p)
          PY
